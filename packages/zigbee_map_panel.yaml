# Zigbee2MQTT map panel — Home Assistant package (v1.1).
# Copy this file to /config/packages/ (with `homeassistant: packages: !include_dir_named packages` in configuration.yaml)
# and restart Home Assistant. panel_custom and a changed ?v= need a full restart, not a reload.
#
# Nothing to edit for a single Zigbee2MQTT instance: the base topic is learned from the retained <topic>/bridge/state
# message and kept in input_text.zigbee_map_base_topic (an "online" one; stale retained "offline" states are ignored).
# Several Zigbee2MQTT instances: set that helper to the one you want and remove the "learn the base topic" automation.
# After a HACS update: bump the ?v= in module_url to the installed version, restart, hard-reload the browser tab.
#
# How it works: a background scan (interval below) asks Zigbee2MQTT for the raw network map (routes off: routing-table
# reads add a 15 s timeout per router that does not answer). Z2M's answer is re-published RETAINED on zigbee_map/latest,
# so the panel has a map the moment it opens, and a scan that finishes after the page was closed is not lost.
# "pull fresh map" in the panel publishes the same request by hand. Admin users only: the panel uses the websocket
# command mqtt/subscribe. First-time defaults: set the two intervals once in the panel's options (2 h / 10 min suggested).
panel_custom:
  - name: zigbee-map-panel
    sidebar_title: Zigbee map
    sidebar_icon: mdi:zigbee
    url_path: zigbee-map
    module_url: /hacsfiles/zigbee2mqtt-map-panel/zigbee2mqtt-map-panel.js?v=1.1.0
    require_admin: true
    config:
      store_topic: zigbee_map/latest
      # base_topic: zigbee2mqtt        # pins the topic for the panel only; normally left to the helper below
      # entity names, only if you rename the helpers:
      # base_topic_entity: input_text.zigbee_map_base_topic
      # scan_interval_entity: input_number.zigbee_map_scan_interval
      # live_interval_entity: input_number.zigbee_map_live_interval
      # last_request_entity: input_datetime.zigbee_map_last_request
      # fast_scan_entity: input_boolean.zigbee_map_fast_scan

# Helpers (all editable in the panel's options menu or anywhere in HA):
#   input_text.zigbee_map_base_topic       Zigbee2MQTT base topic, learned automatically (see above)
#   input_number.zigbee_map_scan_interval  background scan every N hours (0 = off)
#   input_number.zigbee_map_live_interval  while the panel is open and visible, scan every N minutes (0 = off); the panel
#                                          itself issues these requests, so nothing happens when nobody is looking
#   input_datetime.zigbee_map_last_request time of the last scan request (set by the automation and by the panel) — the
#                                          guard that keeps several open panels and the schedule from piling up scans
#   input_boolean.zigbee_map_fast_scan     on: requests go to bridge/request/networkmap_fast (the networkmap_fast external
#                                          extension, see the README); off: Zigbee2MQTT's own sequential scan
input_text:
  zigbee_map_base_topic:
    name: "Zigbee map - Zigbee2MQTT base topic"
    icon: mdi:zigbee
    max: 100

input_number:
  zigbee_map_scan_interval:
    name: "Zigbee map - background scan every"
    icon: mdi:timer-sync-outline
    min: 0
    max: 24
    step: 0.5
    unit_of_measurement: h
    mode: box
  zigbee_map_live_interval:
    name: "Zigbee map - scan while viewing every"
    icon: mdi:eye-refresh-outline
    min: 0
    max: 60
    step: 1
    unit_of_measurement: min
    mode: box

input_boolean:
  zigbee_map_fast_scan:
    name: "Zigbee map - parallel scan (networkmap_fast extension)"
    icon: mdi:fast-forward

input_datetime:
  zigbee_map_last_request:
    name: "Zigbee map - last scan request"
    icon: mdi:radar
    has_date: true
    has_time: true

automation:
  - id: zigbee_map_learn_base_topic
    alias: "Zigbee map - learn the base topic"
    description: "Zigbee2MQTT keeps <base_topic>/bridge/state retained; an 'online' one tells us the base topic. Delete this automation and set the helper by hand if you run several instances."
    triggers:
      - trigger: mqtt
        topic: "+/bridge/state"
    conditions:
      - condition: template
        value_template: >-
          {% set p = trigger.payload_json if trigger.payload_json is mapping else {} %}
          {{ (p.state | default(trigger.payload)) == 'online' }}
      - condition: template
        value_template: "{{ trigger.topic.split('/') | length == 3 and trigger.topic.split('/')[0] != states('input_text.zigbee_map_base_topic') }}"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.zigbee_map_base_topic
        data:
          value: "{{ trigger.topic.split('/')[0] }}"
    mode: queued

  - id: zigbee_map_scan
    alias: "Zigbee map - background network scan"
    description: "Every 5 min: if the background interval is > 0 and that much time has passed since the last request, ask Z2M for the raw map."
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set h = states('input_number.zigbee_map_scan_interval') | float(0) %}
          {% set last = states('input_datetime.zigbee_map_last_request') | as_datetime(none) %}
          {% set base = states('input_text.zigbee_map_base_topic') %}
          {{ base not in ['', 'unknown', 'unavailable'] and h > 0 and (last is none or (now() - last.replace(tzinfo=now().tzinfo)).total_seconds() >= h * 3600 - 90) }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.zigbee_map_last_request
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: mqtt.publish
        data:
          topic: >-
            {{ states('input_text.zigbee_map_base_topic') }}/bridge/request/{{ 'networkmap_fast' if is_state('input_boolean.zigbee_map_fast_scan', 'on') else 'networkmap' }}
          payload: '{"type": "raw", "routes": false}'
    mode: single

  - id: zigbee_map_store
    alias: "Zigbee map - keep the latest scan"
    description: "Re-publishes Z2M's network-map answer retained on zigbee_map/latest with a timestamp. Matches any base topic."
    triggers:
      - trigger: mqtt
        topic: "+/bridge/response/networkmap"
      - trigger: mqtt
        topic: "+/bridge/response/networkmap_fast"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.status == 'ok' }}"
    actions:
      - action: mqtt.publish
        data:
          topic: zigbee_map/latest
          retain: true
          payload: >-
            {"fetchedAt": "{{ now().isoformat() }}", "map": {{ trigger.payload_json.data.value | to_json }}}
    mode: queued
